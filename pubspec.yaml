name: suho_angel
description: APK evidence based reconstruction of the Suhoangel Android app.
publish_to: none
version: 1.0.2+3
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  speech_to_text: ^7.0.0
  video_player: ^2.10.0
  youtube_player_flutter: ^9.1.3
  flutter_tts: ^4.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
