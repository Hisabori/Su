name: Web PWA Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: node --test test-js/*.test.cjs
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node -e "const blob=require('@vercel/blob'); for(const key of ['put','get','list','del']) if(typeof blob[key]!=='function') throw new Error(key)"
      - run: flutter analyze
      - run: flutter test
      - run: bash scripts/build-web.sh
      - name: WebAuthn and browser flow checks
        run: bash scripts/ci-browser-tests.sh
        env:
          PWA_SCREENSHOT_DIR: browser-tests/screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: browser-tests/screenshots/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: suhoangel-web-pwa
          path: build/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  verify-production:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/verify-production.cjs
