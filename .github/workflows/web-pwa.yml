name: Web PWA Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: bash scripts/build-web.sh
      - name: WebAuthn and browser flow checks
        run: bash scripts/ci-browser-tests.sh
      - uses: actions/upload-artifact@v4
        with:
          name: suhoangel-web-pwa
          path: build/web/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
